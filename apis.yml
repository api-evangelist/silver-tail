name: Silver Tail
description: Silver Tail Systems was a website fraud and abuse detection company founded in 2008 in Menlo
  Park, California by Mike Eynon and Laura Mather, both formerly on the anti-fraud team at eBay/PayPal. Its
  product collected and analyzed real-time web traffic to deliver web session intelligence and predictive
  analytics that detected fraud, account takeover, and abuse on banking and commerce websites. Backed by
  Andreessen Horowitz (a16z) among others, the company raised roughly $20M across three rounds before being
  acquired by RSA, the security division of EMC, in 2012 and rebranded as RSA Web Threat Detection. It no
  longer exists as an independent company and publishes no live developer or API surface.
